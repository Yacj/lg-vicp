# 外层 HTTPS 反代示例（lgapi.zblack.cn）。
# 浏览器必须与页面同源访问 API：B 端生产用相对路径 `/`，开发走 Vite `/proxy`。
# 上游为本机 docker nginx：127.0.0.1:8080。
#
# 用法：复制到 /etc/nginx/conf.d/lgapi.conf，改证书路径后 nginx -t && systemctl reload nginx

upstream lg_vicp_docker {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name lgapi.zblack.cn;

    ssl_certificate     /etc/nginx/certs/lgapi.zblack.cn.pem;
    ssl_certificate_key /etc/nginx/certs/lgapi.zblack.cn.key;

    client_max_body_size 2m;
    error_page 502 503 504 @gateway_error;

    location @gateway_error {
        default_type application/json;
        return 502 '{"success":false,"error":{"code":502,"message":"网关暂时不可用"}}';
    }

    location / {
        proxy_pass http://lg_vicp_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
