# 外层 HTTPS 反代示例（lgapi.zblack.cn）。
# 任意浏览器来源均可跨域访问；OPTIONS 在本层直接 204，避免预检打到上游失败被浏览器显示成 CORS。
# 上游为本机 docker nginx：127.0.0.1:8080。
#
# 用法：复制到 /etc/nginx/conf.d/lgapi.conf，改证书路径后 nginx -t && systemctl reload nginx

upstream lg_vicp_docker {
    server 127.0.0.1:8080;
    keepalive 16;
}

map $request_method $cors_preflight {
    default 0;
    OPTIONS 1;
}

server {
    listen 443 ssl;
    server_name lgapi.zblack.cn;

    ssl_certificate     /etc/nginx/certs/lgapi.zblack.cn.pem;
    ssl_certificate_key /etc/nginx/certs/lgapi.zblack.cn.key;

    client_max_body_size 2m;
    error_page 502 503 504 @gateway_error;

    location @gateway_error {
        default_type application/json;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Vary Origin always;
        return 502 '{"success":false,"error":{"code":502,"message":"网关暂时不可用"}}';
    }

    location / {
        if ($cors_preflight = 1) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://lg_vicp_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
