upstream lg_vicp_api {
    server api:3000;
    keepalive 32;
}

# OPTIONS 预检在网关直接结束，避免上游 keepalive 断连/未就绪时 502 HTML 被浏览器显示成 CORS 失败
map $request_method $cors_preflight {
    default 0;
    OPTIONS 1;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    error_page 502 503 504 @gateway_error;

    location @gateway_error {
        default_type application/json;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-Id" always;
        add_header Vary Origin always;
        return 502 '{"success":false,"error":{"code":502,"message":"网关暂时不可用"}}';
    }

    location /api/v1/ai/ {
        if ($cors_preflight = 1) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-Id" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://lg_vicp_api;
        proxy_http_version 1.1;
        # 与 upstream keepalive 配套，避免复用已关闭连接时第一次请求 502
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        if ($cors_preflight = 1) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-Id" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://lg_vicp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
