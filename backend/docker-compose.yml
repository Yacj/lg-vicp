services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lg_vicp_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lg_vicp_backend"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  api:
    build: .
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js && node dist/server.js"]
    environment: &backend-env
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lg_vicp_backend
      DATABASE_MAX_CONNECTIONS: 10
      DATABASE_CONNECT_TIMEOUT_SECONDS: 5
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      REDIS_URL: redis://redis:6379
      AI_RATE_LIMIT_PER_MINUTE: 20
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:?请在 .env 中设置 AI_CONFIG_ENCRYPTION_KEY}
      # 百度短语音识别极速版（未配置时语音转文字接口返回 503）
      BAIDU_ASR_API_KEY: ${BAIDU_ASR_API_KEY:-}
      BAIDU_ASR_SECRET_KEY: ${BAIDU_ASR_SECRET_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lg-vicp}
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_USE_SSL: "false"
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-localhost}
      STORAGE_PUBLIC_PORT: ${STORAGE_PUBLIC_PORT:-9000}
      STORAGE_PUBLIC_USE_SSL: "${STORAGE_PUBLIC_USE_SSL:-false}"
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      # 阿里云 OSS（STORAGE_PROVIDER=oss 时生效；凭据复用 STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY/STORAGE_BUCKET）
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_INTERNAL: "${OSS_INTERNAL:-false}"
      STORAGE_PRESIGN_EXPIRES_SECONDS: ${STORAGE_PRESIGN_EXPIRES_SECONDS:-900}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请在 .env 中设置 BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    # 显式堆上限让 V8 在接近上限时激进 GC 并抛出可捕获的 JS OOM（该任务失败重试即可），
    # 而不是让容器整体被宿主 OOM Killer 强杀，导致所有在跑任务一起 stalled。
    # exec 让 node 取代 sh 成为 PID 1，保证 SIGTERM 直达进程以触发优雅停机
    command: ["sh", "-c", "exec node --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-768} dist/worker.js"]
    environment: *backend-env
    # 0 表示不限制；宿主内存紧张时按实际可用内存设置（如 1500m），需高于堆上限以容纳堆外 Buffer
    mem_limit: ${WORKER_MEMORY_LIMIT:-0}
    depends_on:
      api:
        condition: service_healthy
    # 必须大于 PDF 解析的整体超时（src/workers/pdf-text-extractor.ts，当前 20 分钟），
    # 让活动任务自行结束而不是被强杀
    stop_grace_period: 21m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
